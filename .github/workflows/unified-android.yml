name: Build AmpySongScriber UNIFIED offline APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified/**'
      - '.github/workflows/unified-android.yml'

permissions:
  contents: read

jobs:
  unified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android 36
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install frontend and Android dependencies
        working-directory: unified
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Bundle offline 6-stem model and Basic Pitch
        working-directory: unified
        run: |
          mkdir -p public/ort public/models public/basic-pitch
          cp node_modules/onnxruntime-web/dist/*.wasm public/ort/
          cp node_modules/@spotify/basic-pitch/model/model.json public/basic-pitch/
          cp node_modules/@spotify/basic-pitch/model/*.bin public/basic-pitch/
          curl --retry 5 --retry-delay 8 --connect-timeout 40 -fL \
            'https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx?download=true' \
            -o public/models/htdemucs_6s_fp16weights.onnx
          python3 - <<'PY'
          import pathlib,hashlib
          model=pathlib.Path('public/models/htdemucs_6s_fp16weights.onnx')
          assert 120_000_000 < model.stat().st_size < 200_000_000, "HTDemucs6 model truncated"
          print("6-stem model bytes:",model.stat().st_size)
          print("SHA256:",hashlib.sha256(model.read_bytes()).hexdigest())
          PY
          # The legacy 4-stem embedded ONNX is a verified compatibility fallback.
          # It successfully reached audio inference on this user's Android device.
          curl --retry 4 --retry-delay 8 --connect-timeout 35 -fL \
            'https://huggingface.co/timcsy/demucs-web-onnx/resolve/main/htdemucs_embedded.onnx' \
            -o public/models/htdemucs_embedded.onnx
          printf 'e5e425c17683f163a472462eb5f5a4ffcd11c31858d57fbd0833b012d8b88077  public/models/htdemucs_embedded.onnx\n' | sha256sum -c -
          du -h public/models/* public/basic-pitch/*
      - name: Bundle offline YAMNet instrument classifier (Apache 2.0)
        working-directory: unified
        run: |
          mkdir -p public/yamnet
          python3 - <<'PY'
          import json,urllib.request,hashlib,pathlib
          manifest_url='https://raw.githubusercontent.com/abulhawa/miccheck/main/apps/web/public/models/manifest.json'
          manifest=json.load(urllib.request.urlopen(manifest_url,timeout=30))
          base='https://raw.githubusercontent.com/abulhawa/miccheck/main/apps/web/public/models/'
          for item in manifest['files']:
              if not item['path'].startswith('yamnet/'):continue
              target=pathlib.Path('public')/item['path']
              target.parent.mkdir(parents=True,exist_ok=True)
              urllib.request.urlretrieve(base+item['path'],target)
              raw=target.read_bytes()
              assert len(raw)==item['bytes'],f"Invalid size {target}"
              assert hashlib.sha256(raw).hexdigest()==item['sha256'],f"Invalid hash {target}"
              print(target,len(raw),'SHA256 verified')
          PY
      - name: Verify WAV headers and MusicXML score generator
        working-directory: unified
        run: |
          node scripts/test-wav.mjs
          node scripts/test-notation.mjs
          node scripts/test-note-cleanup.mjs
          node scripts/test-part-buffer.mjs
          node scripts/test-dual-dsp.mjs
          node scripts/test-debug-console.mjs
          node scripts/test-dual-ui-init.mjs
          node scripts/test-gguf-worker-timeout.mjs
          node scripts/test-model-catalog.mjs
          node scripts/test-audio-integrity.mjs
          node scripts/test-qwen-history.mjs
      - name: Bundle local offline GGUF inference WASM runtime
        working-directory: unified
        run: |
          mkdir -p public/wllama
          test -s node_modules/@wllama/wllama/esm/wasm/wllama.wasm
          cp node_modules/@wllama/wllama/esm/wasm/wllama.wasm public/wllama/wllama.wasm
          ls -lh public/wllama/wllama.wasm
      - name: Build embedded offline HTML/JS app
        working-directory: unified
        run: |
          npm run build
          find dist -iname '*gguf-inference-worker*.js' -print
          test -n "$(find dist -iname '*gguf-inference-worker*.js' -print -quit)"
      - name: Create Capacitor Android project
        working-directory: unified
        run: |
          npx cap add android
          npx cap sync android
          # Confirm native file downloader plugin installed for big on-device GGUF files.
          test -d android/capacitor-cordova-android-plugins || true
          grep -R -l 'com.capacitorjs.plugins.filetransfer' android/app/src/main/assets/capacitor.plugins.json || grep -i 'FileTransfer' android/app/src/main/assets/capacitor.plugins.json
      - name: Assemble Android APK
        working-directory: unified/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK contains required local assets
        working-directory: unified
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'htdemucs_6s_fp16weights.onnx'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'htdemucs_embedded.onnx'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'model.json'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'yamnet/model.json'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'wllama/wllama.wasm'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'gguf-inference-worker'
      - name: Upload directly installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AmpySongScriber-UNIFIED-offline-APK
          path: unified/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
